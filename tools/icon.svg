<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- migs-scan launcher icon -->
  <!-- Family motif: bunny ears (shared with migs-music, migs-pod) + a -->
  <!-- document being scanned. Brand colour #1F3A5F (ink blue). -->
  <rect width="108" height="108" fill="#1F3A5F"/>

  <!-- Bunny ears: identical geometry to migs-music / migs-pod -->
  <g fill="#FFFFFF">
    <ellipse cx="45" cy="34" rx="7.5" ry="20" transform="rotate(-12 45 34)"/>
    <ellipse cx="63" cy="34" rx="7.5" ry="20" transform="rotate(12 63 34)"/>
    <!-- Inner ear accent -->
    <ellipse cx="45" cy="35" rx="3.2" ry="12" transform="rotate(-12 45 35)" fill="#1F3A5F"/>
    <ellipse cx="63" cy="35" rx="3.2" ry="12" transform="rotate(12 63 35)" fill="#1F3A5F"/>
  </g>

  <!-- Document page: solid white, gives the same visual weight as the -->
  <!-- mic (pod) / note (music) glyphs -->
  <rect x="40" y="54" width="28" height="30" rx="3.5" fill="#FFFFFF"/>

  <!-- Page text lines + scan beam, brand colour (echoes pod's mic grille) -->
  <g stroke="#1F3A5F" stroke-linecap="round" fill="none">
    <line x1="46" y1="62" x2="62" y2="62" stroke-width="2.4"/>
    <line x1="45" y1="70" x2="63" y2="70" stroke-width="3.8"/>
    <line x1="46" y1="78" x2="62" y2="78" stroke-width="2.4"/>
  </g>

  <!-- Scanner light bar: white nibs poking past the page edges, level with -->
  <!-- the beam, to read unmistakably as an active scan sweep -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" stroke-width="3.8">
    <line x1="33" y1="70" x2="40" y2="70"/>
    <line x1="68" y1="70" x2="75" y2="70"/>
  </g>
</svg>
